# Admin panel — SPA, API proxy and media, all on one origin.
#
# Same single-origin arrangement as the passenger frontend, with one difference
# that matters: this is where films, music and pre-roll creatives are uploaded,
# so the body limits and timeouts here are sized for a 200 MB video rather than
# for a JSON form.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Per-request resolution of `backend` via Docker's embedded DNS — see the
    # frontend's nginx.conf for why this is a variable and not a literal.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Must stay at or above the backend's MAX_VIDEO_UPLOAD_SIZE_MB (200 by
    # default), plus room for the multipart envelope. Raise both together, or
    # nginx will reject the upload with a 413 before multer ever sees it.
    client_max_body_size 2100m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff font/woff2;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        set $upstream http://backend:4000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Stream the upload through to multer instead of spooling the whole
        # 200 MB to nginx's disk first. Halves the I/O and the wait.
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        client_body_timeout   300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ── HTML5 game bundles ───────────────────────────────────────────────────
    # A game is somebody else's JavaScript, and on THIS host it would run in the
    # origin that holds the signed-in administrator's token. `sandbox` gives the
    # document an opaque origin instead: the game still runs — the panel's test
    # frame relies on that — but it cannot read the panel's storage or call the
    # API as the administrator, whether it is opened in that frame or by pasting
    # its address into the bar.
    #
    # The passenger site's nginx.conf serves the very same files WITHOUT this
    # header, on purpose: games keep their progress in localStorage there, and
    # that origin holds nothing worth taking.
    #
    # The three server-level headers are repeated because nginx drops inherited
    # add_header directives as soon as a location declares one of its own.
    location /uploads/games/ {
        alias /var/www/uploads/games/;

        access_log off;
        expires    7d;

        add_header X-Content-Type-Options  nosniff always;
        add_header X-Frame-Options         SAMEORIGIN always;
        add_header Referrer-Policy         strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "sandbox allow-scripts allow-pointer-lock" always;

        try_files $uri =404;
    }

    # ── Uploaded media ───────────────────────────────────────────────────────
    # Read-only view of the same volume the backend writes to, so the panel can
    # preview artwork and play back a creative without going through Node.
    # HLS playlists are revalidated on every load (a cheap 304 when unchanged):
    # they can be rewritten in place, and a week-old cached copy would hide the
    # change. Their segments never change and keep the long cache below. A regex
    # location wins over the /uploads/ prefix; scoped to movies/ so it can never
    # shadow /uploads/games/. `expires epoch` sends Cache-Control: no-cache
    # without an add_header, so the server-level headers are still inherited.
    location ~ ^/uploads/movies/(.+\.m3u8)$ {
        alias /var/www/uploads/movies/$1;
        access_log off;
        expires    epoch;
    }

    location /uploads/ {
        alias /var/www/uploads/;

        access_log off;
        expires    7d;

        try_files $uri =404;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
