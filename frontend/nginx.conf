# Passenger frontend — SPA, API proxy and media, all on one origin.
#
# One origin is the whole point: the browser asks for /api/** and /uploads/**
# from the same host that served the page, so the backend's CORS allow-list is
# never consulted and the bundle needs no build-time knowledge of the machine's
# address. Drop the built site on any LAN IP and it works.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Docker's embedded DNS, used with a variable in proxy_pass below so that
    # `backend` is resolved per request rather than at startup. Without this,
    # nginx refuses to boot while the API container is still coming up, and it
    # would keep talking to a stale IP after the API restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The passenger site posts JSON only — it never uploads. The admin panel is
    # where the large bodies go, and it has its own, much higher limit.
    client_max_body_size 2m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff font/woff2;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        set $upstream http://backend:4000;
        proxy_pass $upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Caddy supplies these values. This container is reachable only on the Docker network.
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # ── Uploaded media ───────────────────────────────────────────────────────
    # Served straight off the shared volume rather than proxied. nginx answers
    # Range requests itself, so seeking inside a film or a pre-roll never wakes
    # Node — which matters on a server handling many viewers at once.
    # HLS playlists are revalidated on every load (a cheap 304 when unchanged):
    # they can be rewritten in place, and a week-old cached copy would hide the
    # change. Their segments never change and keep the long cache below. A regex
    # location wins over the /uploads/ prefix; scoped to movies/ so it can never
    # shadow /uploads/games/. `expires epoch` sends Cache-Control: no-cache
    # without an add_header, so the server-level headers are still inherited.
    location ~ ^/uploads/movies/(.+\.m3u8)$ {
        alias /var/www/uploads/movies/$1;
        access_log off;
        expires    epoch;
    }

    location /uploads/ {
        alias /var/www/uploads/;

        access_log off;
        expires    7d;

        try_files $uri =404;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # Vite fingerprints everything under /assets/, so those are immutable; the
    # entry document must never be cached or a redeploy would go unnoticed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: every unknown path is a React Router route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
